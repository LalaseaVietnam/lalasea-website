<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thực đơn — Lalasea Bistro</title>
  <style>
    :root { --xanh-bien:#0b4f6c; --xanh-ngoc:#1b9aaa; --san-ho:#ff6b6b; --cat:#f4ede4; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--cat); color:#12333f; display:flex; flex-direction:column; min-height:100vh; }
    a { text-decoration:none; color:inherit; }

    header { background:var(--xanh-bien); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:14px 20px; position:sticky; top:0; z-index:10; }
    header .back { display:flex; align-items:center; gap:8px; font-size:15px; opacity:.92; }
    header .back:hover { opacity:1; }
    header .title { font-family:Georgia,serif; font-weight:bold; letter-spacing:2px; font-size:18px; }
    header .title span { color:#7fe3ef; }

    .viewer { position:relative; flex:1; display:flex; flex-direction:column; }
    .track { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; flex:1; -webkit-overflow-scrolling:touch; }
    .track::-webkit-scrollbar { display:none; }
    .slide { min-width:100%; scroll-snap-align:center; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
    .slide img { max-width:100%; max-height:82vh; border-radius:8px; box-shadow:0 12px 34px rgba(11,79,108,.28); background:#fff; }

    .navbtn { position:absolute; top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:50%; border:none; background:rgba(11,79,108,.85); color:#fff; font-size:24px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s, transform .15s; z-index:5; }
    .navbtn:hover { background:var(--san-ho); }
    .navbtn:active { transform:translateY(-50%) scale(.92); }
    .navbtn.prev { left:14px; }
    .navbtn.next { right:14px; }
    .navbtn:disabled { opacity:.3; cursor:default; background:rgba(11,79,108,.85); }

    .counter { text-align:center; padding:12px; background:#fff; color:var(--xanh-bien); font-weight:700; letter-spacing:1px; border-top:1px solid #eee; }
    .hint { text-align:center; font-size:12px; color:#9aa7ac; padding-bottom:12px; background:#fff; }
    @media (max-width:600px){ .hint .desktop{ display:none; } }
    @media (min-width:601px){ .hint .mobile{ display:none; } }
  </style>
</head>
<body>

  <header>
    <a class="back" href="index.html">← Trang chủ</a>
    <div class="title">LALA<span>SEA</span> · Thực đơn</div>
    <span style="width:70px"></span>
  </header>

  <div class="viewer">
    <button class="navbtn prev" id="prev" aria-label="Trang trước">‹</button>
    <button class="navbtn next" id="next" aria-label="Trang sau">›</button>
    <div class="track" id="track">
      <div class="slide"><img src="menu/page1.png" alt="Menu trang 1"></div>
      <div class="slide"><img src="menu/page2.png" alt="Menu trang 2" loading="lazy"></div>
      <div class="slide"><img src="menu/page3.png" alt="Menu trang 3" loading="lazy"></div>
      <div class="slide"><img src="menu/page4.png" alt="Menu trang 4" loading="lazy"></div>
      <div class="slide"><img src="menu/page5.png" alt="Menu trang 5" loading="lazy"></div>
      <div class="slide"><img src="menu/page6.png" alt="Menu trang 6" loading="lazy"></div>
      <div class="slide"><img src="menu/page7.png" alt="Menu trang 7" loading="lazy"></div>
      <div class="slide"><img src="menu/page8.png" alt="Menu trang 8" loading="lazy"></div>
      <div class="slide"><img src="menu/page9.png" alt="Menu trang 9" loading="lazy"></div>
      <div class="slide"><img src="menu/page10.png" alt="Menu trang 10" loading="lazy"></div>
      <div class="slide"><img src="menu/page11.png" alt="Menu trang 11" loading="lazy"></div>
      <div class="slide"><img src="menu/page12.png" alt="Menu trang 12" loading="lazy"></div>
      <div class="slide"><img src="menu/page13.png" alt="Menu trang 13" loading="lazy"></div>
      <div class="slide"><img src="menu/page14.png" alt="Menu trang 14" loading="lazy"></div>
      <div class="slide"><img src="menu/page15.png" alt="Menu trang 15" loading="lazy"></div>
      <div class="slide"><img src="menu/page16.png" alt="Menu trang 16" loading="lazy"></div>
      <div class="slide"><img src="menu/page17.png" alt="Menu trang 17" loading="lazy"></div>
      <div class="slide"><img src="menu/page18.png" alt="Menu trang 18" loading="lazy"></div>
      <div class="slide"><img src="menu/page19.png" alt="Menu trang 19" loading="lazy"></div>
      <div class="slide"><img src="menu/page20.png" alt="Menu trang 20" loading="lazy"></div>
      <div class="slide"><img src="menu/page21.png" alt="Menu trang 21" loading="lazy"></div>
      <div class="slide"><img src="menu/page22.png" alt="Menu trang 22" loading="lazy"></div>
      <div class="slide"><img src="menu/page23.png" alt="Menu trang 23" loading="lazy"></div>
    </div>
  </div>
  <div class="counter"><span id="cur">1</span> / 23</div>
  <div class="hint"><span class="desktop">Dùng nút ‹ › hoặc phím mũi tên để lật trang</span><span class="mobile">Vuốt trái/phải để lật trang</span></div>

  <script>
    const track = document.getElementById('track');
    const cur = document.getElementById('cur');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const total = 23;

    function page() { return Math.round(track.scrollLeft / track.clientWidth); }
    function update() {
      const p = page();
      cur.textContent = p + 1;
      prev.disabled = p <= 0;
      next.disabled = p >= total - 1;
    }
    function go(dir) { track.scrollTo({ left: (page() + dir) * track.clientWidth, behavior: 'smooth' }); }

    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    track.addEventListener('scroll', () => window.requestAnimationFrame(update));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });
    update();
  </script>

</body>
</html>
