# ============================================================
# TỰ ĐỘNG XUẤT BẢN WEBSITE
# Mỗi khi có thay đổi (đăng bài từ trang admin, sửa giao diện...),
# website được dựng lại và đưa lên GitHub Pages sau 1-2 phút.
# ============================================================
name: Xuất bản website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cấu hình GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Cài thư viện
        run: npm ci
      - name: Dựng website
        run: npx eleventy --pathprefix "${{ steps.pages.outputs.base_path }}/"
      - name: Đóng gói kết quả
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Đưa website lên mạng
        id: deployment
        uses: actions/deploy-pages@v4

      # Báo IndexNow: mỗi lần web đổi nội dung, chủ động thông báo cho Bing
      # (nguồn dữ liệu của ChatGPT) và các máy tìm kiếm hỗ trợ, thay vì chờ
      # bot tự quay lại. Bước này lỗi cũng không ảnh hưởng việc xuất bản.
      - name: Báo máy tìm kiếm qua IndexNow
        continue-on-error: true
        run: |
          KEY="cc97fe9ea5cf05654fd1deeed594a344"
          URLS=$(curl -sS https://lalasea.vn/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | sed 's/.*/"&"/' | paste -sd, -)
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"lalasea.vn\",\"key\":\"$KEY\",\"keyLocation\":\"https://lalasea.vn/$KEY.txt\",\"urlList\":[$URLS]}" \
            -w "\nIndexNow HTTP %{http_code}\n"
